    <link rel="stylesheet" type="text/css" href="../style.css">
    <title>Writing - Nikhil Ghosh</title>
    <script>
        (function() {
            var t = localStorage.getItem('theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.setAttribute('data-theme', 'dark');
            }
        })();
    </script>
</head>
<body>

    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
        <span id="theme-icon"></span>
    </button>

    <h1><a href="../">Nikhil Ghosh</a></h1>

    <h3>Writing</h3>

            <span class="post-list-date">May 15, 2025</span>

        </li>
    </ul>

    <p><a href="../">&larr; Home</a></p>

    <script>
        function toggleTheme() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
            }
            updateIcon();
        }
        function updateIcon() {
            var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.getElementById('theme-icon').textContent = isDark ? '\u2600' : '\u263E';
        }
        updateIcon();
    </script>

</body>
</html>
